async function toggleActive(id,v){const {error}=await sb.from('products').update({active:v}).eq('id',id);error?err(error):toast(v?'Activated':'Deactivated')}
function editProduct(id){
  const p=P.find(x=>x.id===id)||{sku:'',name_en:'',name_zh:'',type:'tea',description_en:'',description_zh:'',price_minor:0,stock:0,ship_regions:['GB'],active:false,images:[],weight_g:null,cogs_minor:null};

  app.innerHTML=`<div class="card"><h3>${id?'Edit':'New'} product</h3><div class="grid">
  ${f('sku','SKU')}<div><label>Type</label><select id="f_type">${['tea','teaware','set','sample'].map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
  ${f('name_en','Name (English)')}${f('name_zh','Name (中文)')}
  <div><label>Description (English)</label><textarea id="f_description_en" rows="4">${esc(p.description_en)}</textarea></div>
  <div><label>Description (中文)</label><textarea id="f_description_zh" rows="4">${esc(p.description_zh)}</textarea></div>
  <div><label>Price (GBP, e.g. 12.50)</label><input id="f_price" value="${(p.price_minor/100).toFixed(2)}"></div>
  <div><label>Unit cost GBP (private, for margin)</label><input id="f_cogs" value="${p.cogs_minor!=null?(p.cogs_minor/100).toFixed(2):''}"></div>
  ${f('stock','Stock','number')}${f('weight_g','Weight (g)','number')}
  <div><label>Shipping countries (ISO codes, comma separated, e.g. GB, IE, FR, US)</label><input id="f_ship" value="${esc((p.ship_regions||[]).join(', '))}"></div>
  <div><label>Buying this unlocks course (free)</label><select id="f_grants"><option value="">— none —</option>${(window.COURSES||[]).map(c=>`<option value="${c.id}" ${p.grants_course_id===c.id?'selected':''}>${esc(c.title_en)}</option>`).join('')}</select></div>
  <div><label>Active (visible in app)</label><input id="f_active" type="checkbox" style="width:auto" ${p.active?'checked':''}></div></div>
  <h4>Images</h4><div id="imgs"></div><input type="file" id="up" accept="image/*" multiple style="width:auto">
  <p><button onclick="saveProduct('${id||''}')">Save</button> <button class="sec" onclick="products()">Cancel</button></p></div>`;
  window._imgs=[...(p.images||[])]; if(!_imgs.length&&p.image_url)_imgs.push(p.image_url); drawImgs();
  $('#up').onchange=async e=>{for(const file of e.target.files){const path=`${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.]/g,'_')}`;
    const {error}=await sb.storage.from('product-images').upload(path,file,{contentType:file.type});if(error){err(error);continue}
    _imgs.push(sb.storage.from('product-images').getPublicUrl(path).data.publicUrl);drawImgs()}};
}
function drawImgs(){$('#imgs').innerHTML=_imgs.map((u,i)=>`<span><img class="th" src="${esc(u)}"><button class="sec" onclick="_imgs.splice(${i},1);drawImgs()">×</button></span>`).join('')||'<small>No images</small>'}
async function saveProduct(id){
  const v=k=>$('#f_'+k).value.trim();
  const row={sku:v('sku'),type:v('type'),name_en:v('name_en'),name_zh:v('name_zh'),description_en:v('description_en'),description_zh:v('description_zh'),
    price_minor:Math.round(parseFloat(v('price'))*100),cogs_minor:v('cogs')?Math.round(parseFloat(v('cogs'))*100):null,
    stock:parseInt(v('stock')||'0'),weight_g:v('weight_g')?parseInt(v('weight_g')):null,currency:'GBP',
    ship_regions:v('ship').split(/[ ,]+/).filter(Boolean).map(s=>s.toUpperCase()),active:$('#f_active').checked,images:_imgs,image_url:_imgs[0]||null,grants_course_id:$('#f_grants').value||null};
  if(!row.sku||!row.name_en||!row.name_zh||isNaN(row.price_minor))return toast('SKU, both names and price are required');
  const {error}=id?await sb.from('products').update(row).eq('id',id):await sb.from('products').insert(row);
  if(error)return err(error);toast('Saved');products();
}

async function saveCourse(id){const g=k=>$(`#c_${id}_${k}`).value;const {error}=await sb.from('courses').update({title_en:g('title_en'),title_zh:g('title_zh'),description_en:g('description_en'),description_zh:g('description_zh'),instructor:g('instructor'),status:g('status')}).eq('id',id);error?err(error):toast('Saved')}
async function saveLesson(id){const {error}=await sb.from('course_lessons').update({title_en:$(`#l_${id}_title_en`).value,title_zh:$(`#l_${id}_title_zh`).value,is_preview:$(`#l_${id}_prev`).checked}).eq('id',id);error?err(error):toast('Saved')}
async function addLesson(cid,pos){const {error}=await sb.from('course_lessons').insert({course_id:cid,position:pos,title_en:'New lesson',title_zh:'新课程'});error?err(error):courses()}


// ---------- videos (Cloudflare Stream) ----------
const FN=SB_URL+'/functions/v1/stream-admin';
async function fnHeaders(){const {data:{session}}=await sb.auth.getSession();return {Authorization:'Bearer '+session.access_token,apikey:SB_ANON}}
async function fn(body){const r=await fetch(FN,{method:'POST',headers:{...await fnHeaders(),'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||r.status);return j}
let VBUSY=false;
async function videos(){
  app.innerHTML=`<div class="card"><h3>Course videos → Cloudflare Stream</h3>
  <p>Drag the <b>.mp4</b> files from <b>D:\\tea_subs\\app_en</b> into the box (you can drop them all at once). The number at the start of the file name picks the lesson: <code>NN_title_EN.mp4</code> → lesson NN (00 = trailer).</p>
  <p>No .srt or .m4a files are needed: the subtitles are burned into the picture. Videos upload one at a time; keep this tab open until each says ✅. If one fails or gets stuck, reload this page and drop that file again; it starts over cleanly and replaces the earlier attempt.</p>
  <div id="drop" style="border:3px dashed #1F4D3A;border-radius:12px;padding:40px;text-align:center;background:#fffaf0">Drop files here or <input type="file" id="vf" multiple accept=".mp4,.mov,.srt,.vtt,.m4a,.aac,.mp3,.wav" style="width:auto"></div>
  <div id="queue"></div></div><div class="card"><h3>Lessons <button class="sec" onclick="vstatus()">Refresh</button></h3><div id="vlist">Loading…</div></div>`;
  const d=$('#drop');d.ondragover=e=>{e.preventDefault();d.style.background='#e8f3ea'};d.ondragleave=()=>d.style.background='#fffaf0';
  d.ondrop=e=>{e.preventDefault();d.style.background='#fffaf0';vqueue([...e.dataTransfer.files])};$('#vf').onchange=e=>vqueue([...e.target.files]);
  vstatus();
}
async function vstatus(){
  try{const {lessons}=await fn({action:'status'});
  $('#vlist').innerHTML='<table><tr><th>#</th><th>Lesson</th><th>Free</th><th>Video</th><th>Captions</th><th>Audio</th></tr>'+lessons.map(l=>`<tr><td>${String(l.position).padStart(2,'0')}</td><td>${esc(l.title_en)}<br><small>${esc(l.title_zh)}</small></td><td>${l.is_preview?'✓':''}</td>
  <td>${l.stream_uid?`<span class="tag ${/ready/.test(l.state)?'approved':'pending'}">${esc(l.state)}</span><br><small>${esc(l.stream_uid)}</small>`:'<small>—</small>'}</td><td>${esc((l.caption_langs||[]).join(', '))}</td><td>${esc((l.audio_langs||[]).join(', '))}</td></tr>`).join('')+'</table>';}catch(e){err(e)}
}
function vkind(name){let m;
  if(m=name.match(/^(\d{2})_.*\.(mp4|mov)$/i))return{pos:+m[1],kind:'video'};
  if(m=name.match(/^(\d{2})_en\.(srt|vtt)$/i))return{pos:+m[1],kind:'caption',lang:'en'};
  if(m=name.match(/^(\d{2})(_zh)?\.(srt|vtt)$/i))return{pos:+m[1],kind:'caption',lang:'zh'};
  if(m=name.match(/^(\d{2})_en\.(m4a|aac|mp3|wav)$/i))return{pos:+m[1],kind:'audio'};
  return null}
const VQ=[];
function vqueue(files){
  for(const f of files){const k=vkind(f.name);const row={f,k,st:k?'waiting':'skipped (name not recognised)',id:'q'+Math.random().toString(36).slice(2)};VQ.push(row)}
  VQ.sort((a,b)=>(a.k?.kind==='video'?0:1)-(b.k?.kind==='video'?0:1));vdraw();vrun()}
function vdraw(){const q=$('#queue');if(q)q.innerHTML='<table>'+VQ.map(r=>`<tr><td>${esc(r.f.name)}</td><td>${r.k?r.k.kind+' → lesson '+String(r.k.pos).padStart(2,'0')+(r.k.lang?' ('+r.k.lang+')':''):''}</td><td id="${r.id}">${esc(r.st)}</td></tr>`).join('')+'</table>'}
function vset(r,t){r.st=t;const c=document.getElementById(r.id);if(c)c.textContent=t}
const srt2vtt=t=>'WEBVTT\n\n'+t.replace(/^\uFEFF/,'').replace(/\r/g,'').replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g,'$1.$2').trim()+'\n';
async function vrun(){
  if(VBUSY)return;VBUSY=true;
  try{for(;;){const r=VQ.find(x=>x.k&&x.st==='waiting');if(!r)break;
    try{
      if(r.k.kind==='video'){await vupload(r)}
      else if(r.k.kind==='caption'){vset(r,'uploading…');let t=await r.f.text();if(!/^\uFEFF?WEBVTT/.test(t))t=srt2vtt(t);await fn({action:'caption',position:r.k.pos,lang:r.k.lang,vtt:t});vset(r,'✅ done')}
      else if(r.k.kind==='audio'){vset(r,'uploading audio…');const path=`${String(r.k.pos).padStart(2,'0')}/${Date.now()}-${r.f.name.replace(/[^a-zA-Z0-9._]/g,'_')}`;
        const {error}=await sb.storage.from('stream-audio').upload(path,r.f,{contentType:r.f.type||'audio/mp4'});if(error)throw error;
        await fn({action:'audio',position:r.k.pos,path});vset(r,'✅ sent to Stream (processing)')}
    }catch(e){console.error(e);vset(r,'❌ '+(e.message||e))}
  }}finally{VBUSY=false;vstatus()}
}
async function vupload(r){
  const headers=await fnHeaders();
  await new Promise((res,rej)=>{
    // Supabase auth headers go ONLY to our function (creation POST). Sending them to Cloudflare's
    // upload URL breaks the CORS preflight (apikey/Authorization not allowed) and stalls at 0%.
    const up=new tus.Upload(r.f,{endpoint:FN+'?action=tus&position='+r.k.pos,chunkSize:50*1024*1024,retryDelays:[0,3000,10000,30000],
      metadata:{filetype:r.f.type||'video/mp4'},storeFingerprintForResuming:false,
      onBeforeRequest:req=>{if(req.getURL().startsWith(FN))for(const [k,v] of Object.entries(headers))req.setHeader(k,v)},
      onError:e=>rej(e),onProgress:(a,b)=>vset(r,'uploading '+(a/b*100).toFixed(1)+'%  ('+(a/1048576).toFixed(0)+' / '+(b/1048576).toFixed(0)+' MB)'),
      onSuccess:async()=>{try{const uid=up.url.split('/').pop().split('?')[0];await fn({action:'attach',position:r.k.pos,uid});vset(r,'✅ uploaded, Cloudflare is processing');res()}catch(e){rej(e)}}});
    vset(r,'starting…');up.start();
  });
}

  let q=sb.from('orders').select('*, order_items(quantity, unit_price_minor, products(sku,name_en))').order('created_at',{ascending:false}).limit(200);
  if(st!=='all')q=q.eq('status',st);
  const {data,error}=await q;if(error)return err(error);
  const addr=a=>a?esc([a.line1,a.line2,a.city,a.state,a.postal_code,a.country].filter(Boolean).join(', ')):'';
  app.innerHTML=`<p>Status: <select style="width:auto" onchange="_ost=this.value;orders()">${['paid','shipped','completed','pending','cancelled','refunded','all'].map(s=>`<option ${s===st?'selected':''}>${s}</option>`).join('')}</select></p>
  <table><tr><th>Date</th><th>Status</th><th>Customer / ship to</th><th>Items</th><th>Total</th><th>Shipping</th></tr>`+data.map(o=>`<tr>
  <td>${new Date(o.created_at).toLocaleString('en-GB')}<br>${o.is_test?'<span class="tag">TEST</span>':''}</td><td><span class="tag ${o.status}">${o.status}</span></td>
  <td>${esc(o.shipping_name)}<br><small>${addr(o.shipping_address)}<br>${esc(o.customer_email)}</small></td>
  <td>${o.order_items.map(i=>`${i.quantity}× ${esc(i.products?.name_en)} <small>(${esc(i.products?.sku)})</small>`).join('<br>')}</td>
  <td>${money(o.amount_minor)}<br><small>incl. ship ${money(o.shipping_minor)}</small></td>
  <td>${o.status==='paid'?`<input id="tr_${o.id}" placeholder="Tracking number"><input id="ca_${o.id}" placeholder="Carrier" value="Royal Mail"><button onclick="ship('${o.id}')">Mark shipped</button>`:
     `${esc(o.carrier)} ${esc(o.tracking_number)}${o.status==='shipped'?`<br><button class="sec" onclick="setStatus('${o.id}','completed')">Mark completed</button>`:''}`}</td></tr>`).join('')+'</table>'+(data.length?'':'<p>No orders</p>');
}
async function ship(id){const tn=$('#tr_'+id).value.trim();if(!tn)return toast('Enter a tracking number');
  const {error}=await sb.from('orders').update({status:'shipped',tracking_number:tn,carrier:$('#ca_'+id).value.trim(),shipped_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',id);error?err(error):(toast('Marked shipped'),orders())}
async function setStatus(id,s){const {error}=await sb.from('orders').update({status:s,updated_at:new Date().toISOString()}).eq('id',id);error?err(error):orders()}

// ---------- moderation ----------
async function moderation(){
  const {data,error}=await sb.rpc('admin_queue');if(error)return err(error);
  const rows=[];for(const r of data){const urls=[];for(const p of r.photo_paths||[]){const {data:s}=await sb.storage.from('checkin-photos').createSignedUrl(p,600);if(s)urls.push(s.signedUrl)}rows.push({...r,urls})}
  app.innerHTML=`<p>Open reports and posts held by the word list / AI screening. Reported content is hidden from the reporter at once and from everyone after 3 reports. Apple expects reports to be handled within 24 hours.</p><table><tr><th>Type</th><th>Content</th><th>Status</th><th>Reports</th><th>Actions</th></tr>`+
  rows.map(r=>`<tr><td>${r.target_type}</td><td>${esc(r.content)}<br>${r.urls.map(u=>`<a href="${u}" target="_blank"><img class="th" src="${u}"></a>`).join('')}<br><small>author ${esc(r.author_id)} ${r.author_banned?'<span class="tag rejected">banned</span>':''}</small></td>
  <td><span class="tag ${r.moderation_status}">${r.moderation_status}</span><br><small>${esc(r.moderation_note)}</small></td><td>${r.report_count}<br><small>${esc(r.reasons.join('; '))}</small></td>
  <td>${r.target_type!=='user'?`<button class="red" onclick="mod('${r.target_type}','${r.target_id}','hide')">Hide</button> <button class="sec" onclick="mod('${r.target_type}','${r.target_id}','restore')">Restore</button>`:`<button class="sec" onclick="mod('user','${r.target_id}','dismiss')">Dismiss</button>`}
  <br><br><button class="red" onclick="ban('${r.author_id}',${!r.author_banned})">${r.author_banned?'Unban':'Ban'} user</button></td></tr>`).join('')+'</table>'+(rows.length?'':'<p>Queue is empty 🎉</p>');
}
async function mod(t,id,a){const {error}=await sb.rpc('admin_moderate',{t,target:id,action:a});error?err(error):(toast('Done'),moderation())}
async function ban(uid,b){if(!confirm(b?'Ban this user and hide all their posts?':'Unban this user?'))return;const {error}=await sb.rpc('admin_set_ban',{target:uid,ban:b});error?err(error):(toast('Done'),moderation())}

// ---------- Tea Fairy's Picks & official posts ----------
const thisMonth=()=>new Date().toISOString().slice(0,7);
async function community(){
  const [{data:acc,error:e1},{data:posts,error:e2}]=await Promise.all([sb.rpc('admin_official_accounts'),
    sb.from('brew_checkins').select('id,user_id,text,photo_paths,stream_uid,video_path,author_name,author_badge,pick_month,pick_note,created_at').eq('visibility','public').eq('moderation_status','approved').order('created_at',{ascending:false}).limit(60)]);
  if(e1||e2)return err(e1||e2);
  const official=acc||[];
  const rows=[];for(const r of posts){let u=null;if(r.photo_paths?.[0]){const {data:x}=await sb.storage.from('checkin-photos').createSignedUrl(r.photo_paths[0],600);u=x?.signedUrl}rows.push({...r,u})}
  app.innerHTML=`<div class="card"><h3>Tea Fairy's Picks</h3><p>An <b>editorial selection</b> by our team — never call it a contest, competition or prize draw. Picks for the latest month show on the app's Today tab; the author sees a “Tea Fairy's Pick” note on their check-in.</p></div>
  <div class="card"><h3>Official account</h3><p>Shown in the app with an “Official” badge and can be posted for from here. It must have signed in to the app once. Team members simply use the app as normal users.</p>
  <table><tr><th>Email</th><th>Name</th><th></th></tr>${(acc||[]).map(a=>`<tr><td>${esc(a.email)}</td><td>${esc(a.nickname)}</td><td><button class="sec" onclick="setRole('${esc(a.email)}','')">Remove</button></td></tr>`).join('')}</table>
  <p><input id="ra_em" placeholder="email" style="width:260px"> <input id="ra_nick" placeholder="display name (optional)" style="width:200px"> <button onclick="setRole($('#ra_em').value,'official',$('#ra_nick').value)">Save</button></p></div>
  <div class="card"><h3>Post as the official account</h3>${official.length?`<p>Account <select id="np_author" style="width:auto">${official.map(a=>`<option value="${a.id}">${esc(a.nickname||a.email)}</option>`).join('')}</select></p>
  <p>Caption</p><textarea id="np_text" maxlength="500" rows="3" style="width:100%"></textarea>
  <p>Photos (up to 3) <input id="np_photos" type="file" accept="image/*" multiple></p>
  <p>…or short video (MP4/MOV, max 50 MB, ~60 s) <input id="np_video" type="file" accept="video/mp4,video/quicktime"> or Cloudflare Stream UID <input id="np_stream" style="width:300px"></p>
  <p><label><input id="np_pick" type="checkbox" style="width:auto"> Mark as Tea Fairy's Pick for</label> <input id="np_month" type="month" value="${thisMonth()}" style="width:auto"> note <input id="np_note" placeholder="optional reward / thank-you note" style="width:260px"></p>
  <p><button id="np_btn" onclick="newPost()">Publish</button></p>`:'<p>Add the official account above first.</p>'}</div>
  <div class="card"><h3>Public check-ins</h3><table><tr><th></th><th>Author</th><th>Caption</th><th>Pick</th></tr>${rows.map(r=>`<tr><td>${r.u?`<img class="th" src="${r.u}">`:r.stream_uid||r.video_path?'🎬':''}</td>
  <td>${esc(r.author_name||r.user_id.slice(0,8))} ${r.author_badge?'<span class="tag approved">official</span>':''}<br><small>${new Date(r.created_at).toLocaleDateString()}</small></td><td>${esc(r.text)}</td>
  <td><input id="pm_${r.id}" type="month" value="${r.pick_month?r.pick_month.slice(0,7):thisMonth()}" style="width:auto"><br><input id="pn_${r.id}" value="${esc(r.pick_note)}" placeholder="optional note"><br>
  ${r.pick_month?`<span class="tag approved">pick ${r.pick_month.slice(0,7)}</span> <button class="sec" onclick="setPick('${r.id}',true)">Update</button> <button class="red" onclick="setPick('${r.id}',false)">Unpick</button>`:`<button onclick="setPick('${r.id}',true)">Mark as pick</button>`}</td></tr>`).join('')}</table></div>`;
}
async function setRole(email,b,nick){if(!email)return;const {error}=await sb.rpc('admin_set_badge',{email:email.trim(),b,nick:nick||null});error?err(error):(toast('Saved'),community())}
async function setPick(id,on){const m=$('#pm_'+id).value;const {error}=await sb.rpc('admin_set_pick',{c:id,pick:on&&m?m+'-01':null,note:on?$('#pn_'+id).value:null});error?err(error):(toast('Saved'),community())}
async function newPost(){
  const author=$('#np_author').value,btn=$('#np_btn');btn.disabled=true;
  try{
    const photos=[];for(const [i,f] of [...$('#np_photos').files].slice(0,3).entries()){const path=`${author}/${Date.now()}-${i}.${(f.name.split('.').pop()||'jpg').toLowerCase()}`;const {error}=await sb.storage.from('checkin-photos').upload(path,f,{contentType:f.type});if(error)throw error;photos.push(path)}
    let video=null;const vf=$('#np_video').files[0];
    if(vf){if(vf.size>50*1024*1024)throw new Error('Video is over 50 MB');video=`${author}/${Date.now()}.${vf.type==='video/quicktime'?'mov':'mp4'}`;const {error}=await sb.storage.from('checkin-videos').upload(video,vf,{contentType:vf.type});if(error)throw error}
    if(!photos.length&&!video&&!$('#np_stream').value.trim())throw new Error('Add a photo or a video');
    const {error}=await sb.rpc('admin_create_post',{author,caption:$('#np_text').value,photos,stream:$('#np_stream').value.trim(),video,pick:$('#np_pick').checked?$('#np_month').value+'-01':null,note:$('#np_note').value||null});
    if(error)throw error;toast('Published');community();
  }catch(e){err(e)}finally{btn.disabled=false}
}

// ---------- Partners (KOL / influencers) + course codes ----------
let PT=[];
async function partners(){
  const [{data:ps,error:e1},{data:st,error:e2},{data:codes,error:e3}]=await Promise.all([sb.from('partners').select('*').order('created_at',{ascending:false}),sb.rpc('admin_partner_stats'),sb.from('course_codes').select('*').order('created_at',{ascending:false}).limit(200)]);
  if(e1||e2||e3)return err(e1||e2||e3);PT=ps;const S=Object.fromEntries((st||[]).map(x=>[x.partner_id,x]));
  app.innerHTML=`<div class="card"><h3>Partner program</h3><p>Referral codes give fans a discount on <b>physical tea orders (Stripe) only</b> — never on the in-app course (Apple IAP). Share link: <code>https://teafairyworld.co.uk/r/CODE</code> (fans can also type the code in the cart). Commission = % of net order value (excl. shipping, tax and discounts); refunded orders are reversed automatically. Test-mode orders are not counted.</p>
  <p><b>Disclosure (UK ASA / CMA rules):</b> partners must clearly label every post that promotes us: <b>#ad</b> when paid or earning commission, <b>#gifted</b> when they received free products with no other obligation — at the start of the caption, visible without clicking “more”, and spoken/on-screen in videos. Put this in every partner agreement and check their posts; no health or medical claims about tea.</p></div>
  <div class="card"><button onclick="editPartner()">+ New partner</button> <span id="pform"></span>
  <table><tr><th>Partner</th><th>Code</th><th>Fan / commission</th><th>Status</th><th>Clicks</th><th>Orders</th><th>Net revenue</th><th>Owed</th><th>Paid</th><th></th></tr>${ps.map(p=>{const x=S[p.id]||{};return `<tr><td><b>${esc(p.name)}</b> ${esc(p.handle)}<br><small>${esc(p.links)}</small><br><small>${esc(p.payout_notes)}</small></td><td><code>${esc(p.code)}</code></td><td>${p.fan_discount_pct}% / ${p.commission_pct}%</td><td>${esc(p.status)}</td>
  <td>${x.clicks??0}</td><td>${x.orders??0}${x.reversed?` <small>(${x.reversed} refunded)</small>`:''}</td><td>${money(x.revenue_minor||0)}</td><td>${money(x.commission_owed_minor||0)}</td><td>${money(x.commission_paid_minor||0)}</td>
  <td><button class="sec" onclick="editPartner('${p.id}')">Edit</button> <button class="sec" onclick="markPaid('${p.id}')">Mark owed as paid</button></td></tr>`}).join('')}</table>
  <p>Monthly CSV <input id="csv_m" type="month" value="${new Date().toISOString().slice(0,7)}" style="width:auto"> <button class="sec" onclick="partnerCsv()">Export</button></p></div>
  <div class="card"><h3>Course redemption codes</h3><p>Single-use codes that unlock the course free (granted on our server, not through Apple). <b>Apple risk:</b> Apple prefers its own Offer Codes for In-App Purchase content and may question custom unlock codes during review — use sparingly (partners, press, gifts), don’t sell them, and don’t mention them in the app’s marketing. Prefer Apple Offer Codes in App Store Connect once the Paid Apps agreement is active.</p>
  <p>Generate <input id="cc_n" type="number" value="10" min="1" max="500" style="width:80px"> codes, note <input id="cc_note" placeholder="e.g. OMAR10 giveaway" style="width:220px">, expire after <input id="cc_days" type="number" placeholder="days (optional)" style="width:120px"> <button onclick="genCodes()">Generate</button></p>
  <table><tr><th>Code</th><th>Note</th><th>Created</th><th>Expires</th><th>Redeemed</th></tr>${(codes||[]).map(c=>`<tr><td><code>${esc(c.code)}</code></td><td>${esc(c.note)}</td><td>${new Date(c.created_at).toLocaleDateString()}</td><td>${c.expires_at?new Date(c.expires_at).toLocaleDateString():''}</td><td>${c.redeemed_at?new Date(c.redeemed_at).toLocaleString():'—'}</td></tr>`).join('')}</table></div>`;
}
function editPartner(id){const p=PT.find(x=>x.id===id)||{fan_discount_pct:10,commission_pct:10,status:'active'};
  $('#pform').innerHTML=`<div class="card"><p>Name <input id="pf_name" value="${esc(p.name)}"></p><p>Handle <input id="pf_handle" value="${esc(p.handle)}" placeholder="@omar"></p><p>Platform links <input id="pf_links" value="${esc(p.links)}" placeholder="TikTok / Instagram / YouTube URLs"></p>
  <p>Referral code <input id="pf_code" value="${esc(p.code)}" placeholder="OMAR10" style="text-transform:uppercase"></p><p>Fan discount % <input id="pf_fan" type="number" value="${p.fan_discount_pct}"> Commission % of net <input id="pf_com" type="number" value="${p.commission_pct}"></p>
  <p>Status <select id="pf_status" style="width:auto">${['active','paused','ended'].map(x=>`<option ${x===p.status?'selected':''}>${x}</option>`).join('')}</select></p><p>Payout notes <input id="pf_notes" value="${esc(p.payout_notes)}" placeholder="PayPal / bank, terms…"></p>
  <p><button onclick="savePartner(${id?`'${id}'`:'null'})">Save</button></p></div>`}
async function savePartner(id){const row={name:$('#pf_name').value.trim(),handle:$('#pf_handle').value.trim()||null,links:$('#pf_links').value.trim()||null,code:$('#pf_code').value.trim().toUpperCase(),fan_discount_pct:+$('#pf_fan').value,commission_pct:+$('#pf_com').value,status:$('#pf_status').value,payout_notes:$('#pf_notes').value.trim()||null};
  const q=id?sb.from('partners').update(row).eq('id',id):sb.from('partners').insert(row);const {error}=await q;error?err(error):(toast('Saved'),partners())}
async function markPaid(id){if(!confirm('Mark all owed commission for this partner as paid?'))return;const {error}=await sb.from('partner_commissions').update({status:'paid',paid_at:new Date().toISOString()}).eq('partner_id',id).eq('status','owed').eq('is_test',false);error?err(error):(toast('Done'),partners())}
async function partnerCsv(){const m=$('#csv_m').value,start=m+'-01',end=new Date(Date.UTC(+m.slice(0,4),+m.slice(5,7),1)).toISOString();
  const {data,error}=await sb.from('partner_commissions').select('created_at,status,net_minor,commission_minor,currency,is_test,paid_at,partners(name,code),orders(stripe_session_id,referral_code)').gte('created_at',start).lt('created_at',end).order('created_at');if(error)return err(error);
  const rows=[['date','partner','code','order','net','commission','currency','status','paid_at','test']].concat(data.map(r=>[r.created_at,r.partners?.name,r.partners?.code,r.orders?.stripe_session_id,(r.net_minor/100).toFixed(2),(r.commission_minor/100).toFixed(2),r.currency,r.status,r.paid_at||'',r.is_test]));
  const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`partner-commissions-${m}.csv`;a.click()}
async function genCodes(){const {data,error}=await sb.rpc('admin_generate_course_codes',{n:+$('#cc_n').value,note:$('#cc_note').value||null,days:$('#cc_days').value?+$('#cc_days').value:null});if(error)return err(error);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['code\n'+data.join('\n')],{type:'text/csv'}));a.download='course-codes.csv';a.click();toast(data.length+' codes generated');partners()}
sb.auth.onAuthStateChange(()=>{});boot();
</script></body></html>
