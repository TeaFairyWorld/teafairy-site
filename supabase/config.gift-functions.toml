# Merge these keys into TeaFairyWorld/teatok supabase/config.toml.
# Do not replace that file. gift-redeem is called by winners who have no app account,
# so the gateway must not require a user JWT. The anon key is only the public gateway
# key. gift-admin keeps user JWT verification, and the function then checks profiles.is_admin.

[functions.gift-redeem]
verify_jwt = false

[functions.gift-admin]
verify_jwt = true
